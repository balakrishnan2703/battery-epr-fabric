    <style>
      :root {
        --copper: #C96A36;
        --copper-rgb: 201 106 54;
        --copper-light: #E58A50;
        --copper-light-rgb: 229 138 80;
        --copper-deep: #8E4528;
        --copper-deep-rgb: 142 69 40;
        --surface-near-black: #17191C;
        --surface-raised: #23262A;
        --text-on-dark: #F5F5F3;
        --text-secondary: #B8B9BA;
        --content-light: #F4F3F0;
        --text-on-light: #202124;
        --border-dark: #3A3D41;
      }
      body {
        font-family: 'Inter', sans-serif;
        background-color: var(--surface-near-black);
        color: var(--text-on-dark);
      }
      :focus-visible {
        outline: 2px solid var(--copper-light);
        outline-offset: 2px;
      }
      input, select, textarea {
        accent-color: var(--copper);
      }
      [class~="hover:bg-emerald-500"]:hover,
      [class~="hover:bg-green-500"]:hover,
      [class~="hover:bg-blue-500"]:hover,
      [class~="hover:bg-teal-500"]:hover,
      [class~="hover:bg-amber-500"]:hover,
      [class~="hover:bg-purple-500"]:hover,
      [class~="hover:bg-rose-500"]:hover {
        background-color: var(--copper-deep);
      }
      [class~="border-slate-800"],
      [class~="border-slate-800/80"],
      [class~="border-slate-800/50"],
      [class~="border-slate-800/40"] {
        border-color: var(--border-dark);
      }
      .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: var(--surface-near-black);
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: var(--border-dark);
        border-radius: 3px;
      }
    </style>
  </head>
  <body class="min-h-screen bg-slate-950 text-slate-100 antialiased selection:bg-emerald-500 selection:text-white">
